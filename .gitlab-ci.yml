# .gitlab-ci.yml
stages:
  - deploy

variables:
  DEPLOY_PATH: "/var/www/probyteg"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH"
    # Sincroniza el sitio (excluye .git, node_modules, etc.)
    - rsync -avz --delete --exclude='.git' --exclude='.gitlab-ci.yml' -e ssh ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    # Recarga nginx para aplicar cualquier cambio
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo nginx -t && sudo systemctl reload nginx"
  only:
    - main